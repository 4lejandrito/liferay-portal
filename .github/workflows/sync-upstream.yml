on:
  schedule:
  - cron:  "*/15 * * * *"
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: repo-sync
      uses: repo-sync/github-sync@v2
      with:
        source_repo: "liferay/liferay-portal"
        source_branch: "master"
        destination_branch: "master"
        github_token: ${{ github.token }}
